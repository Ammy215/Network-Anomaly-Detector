name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # pytest.ini already sets `addopts = -m "not llm"`, so the 4 tests
        # that call a real LLM are excluded by default -- no live calls,
        # no secrets needed here.
        #
        # `python -m pytest`, not bare `pytest`: -m inserts the cwd (backend/)
        # onto sys.path, which is what makes `from app...` importable in
        # every test module. The bare console-script entry point does not
        # do this and fails 4 modules with ModuleNotFoundError: No module
        # named 'app' -- reproduced locally both in a plain python:3.12-slim
        # container and in the project's own venv before this fix.
        run: python -m pytest -v
